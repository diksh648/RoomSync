<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RoomSync – Find PG</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d1a;min-height:100vh;color:#fff;}
    body::before{content:'';position:fixed;top:-20%;left:-10%;width:50%;height:70%;
      background:radial-gradient(ellipse,rgba(120,0,30,.4) 0%,transparent 70%);pointer-events:none;z-index:0;}
    body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:50%;height:70%;
      background:radial-gradient(ellipse,rgba(10,20,80,.4) 0%,transparent 70%);pointer-events:none;z-index:0;}
    header{position:sticky;top:0;z-index:100;background:rgba(13,13,26,.92);
      border-bottom:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);
      display:flex;align-items:center;justify-content:space-between;padding:0 24px;height:64px;}
    .logo{display:flex;align-items:center;gap:8px;text-decoration:none;}
    .logo span{font-size:22px;font-weight:900;background:linear-gradient(135deg,#FF4444,#FF8C00);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .nav-tabs{display:flex;gap:8px;}
    .tab{padding:8px 20px;border:none;border-radius:50px;font-size:14px;font-weight:600;
      cursor:pointer;transition:all .2s;background:rgba(255,255,255,.07);color:#aaa;position:relative;}
    .tab.active{background:linear-gradient(135deg,#FF4444,#FF8C00);color:#fff;box-shadow:0 4px 16px rgba(255,68,68,.35);}
    .tab:hover:not(.active){background:rgba(255,255,255,.12);color:#fff;}
    .notif-dot{position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;
      background:#FF4444;border:2px solid #0d0d1a;display:none;}
    .header-right{display:flex;align-items:center;gap:10px;}
    .free-badge{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;}
    .free-badge.ok{background:rgba(52,211,153,.15);color:#34d399;border:1px solid rgba(52,211,153,.3);}
    .free-badge.warn{background:rgba(255,140,0,.15);color:#FF8C00;border:1px solid rgba(255,140,0,.3);}
    .free-badge.locked{background:rgba(255,68,68,.15);color:#ff6b6b;border:1px solid rgba(255,68,68,.3);}
    .user-name{color:#aaa;font-size:13px;}
    .btn-logout{padding:7px 14px;border:1px solid rgba(255,80,80,.4);border-radius:50px;background:transparent;color:#ff6b6b;font-size:12px;cursor:pointer;font-weight:600;}
    main{position:relative;z-index:1;padding:24px;max-width:960px;margin:0 auto;}
    .section{display:none;}.section.active{display:block;}
    .search-card{background:rgba(22,22,40,.85);border:1px solid rgba(255,255,255,.08);
      border-radius:18px;padding:20px 22px;margin-bottom:20px;backdrop-filter:blur(10px);}
    .search-card h2{font-size:15px;font-weight:700;margin-bottom:12px;
      background:linear-gradient(135deg,#FF4444,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .search-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
    .field{flex:1;min-width:140px;}
    .field label{display:block;color:#aaa;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:5px;}
    .field input,.field select{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
      border-radius:10px;padding:11px 14px;color:#fff;font-size:14px;outline:none;transition:border-color .2s;-webkit-appearance:none;}
    .field select option{background:#1a1a2e;}.field input:focus,.field select:focus{border-color:#FF6B35;}
    .field input::placeholder{color:#555;}
    .btn-search{padding:11px 22px;border:none;border-radius:10px;background:linear-gradient(135deg,#FF4444,#FF8C00);
      color:#fff;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap;box-shadow:0 4px 16px rgba(255,68,68,.3);}
    .btn-reset{padding:11px 14px;border:1px solid rgba(255,255,255,.15);border-radius:10px;background:transparent;color:#888;font-size:14px;cursor:pointer;}
    .results-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
    .results-hdr h3{color:#ccc;font-size:14px;}.results-hdr span{color:#888;font-size:12px;}
    .pg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:16px;}
    .pg-card{background:rgba(22,22,40,.85);border:1px solid rgba(255,255,255,.08);
      border-radius:16px;overflow:hidden;transition:transform .2s,box-shadow .2s;cursor:pointer;}
    .pg-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px rgba(0,0,0,.5);}
    .pg-photos{height:185px;overflow:hidden;position:relative;}
    .pg-photos img{width:100%;height:100%;object-fit:cover;transition:transform .3s;}
    .pg-card:hover .pg-photos img{transform:scale(1.04);}
    .pg-photos .no-photo{width:100%;height:100%;background:rgba(255,255,255,.04);display:flex;align-items:center;justify-content:center;font-size:40px;}
    .photo-count{position:absolute;bottom:7px;right:9px;background:rgba(0,0,0,.65);border-radius:20px;padding:2px 9px;font-size:11px;color:#ddd;}
    .pg-body{padding:13px 15px;}
    .pg-body h3{font-size:15px;font-weight:700;margin-bottom:3px;}
    .pg-loc{font-size:12px;color:#888;margin-bottom:8px;}
    .pg-badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
    .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
    .gm{background:rgba(96,165,250,.15);color:#60A5FA;}.gf{background:rgba(244,114,182,.15);color:#F472B6;}
    .ga{background:rgba(52,211,153,.15);color:#34D399;}.bs{background:rgba(167,139,250,.15);color:#A78BFA;}
    .pg-stats{display:flex;gap:12px;font-size:12px;color:#777;margin-bottom:10px;}
    .pg-seller{font-size:12px;color:#888;margin-bottom:10px;}
    .pg-seller span{color:#FF8C00;}
    .btn-contact{width:100%;padding:10px;border:none;border-radius:10px;
      background:linear-gradient(135deg,#FF4444,#FF8C00);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;align-items:center;justify-content:center;}
    .modal-overlay.open{display:flex;}
    .modal-box{background:#1a1a2e;border-radius:20px;max-width:680px;width:92%;max-height:90vh;overflow-y:auto;padding:22px;position:relative;}
    .modal-close{position:absolute;top:13px;right:15px;background:none;border:none;color:#888;font-size:20px;cursor:pointer;}
    .modal-photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-bottom:14px;}
    .modal-photos img{width:100%;border-radius:8px;}
    .chat-layout{display:flex;height:calc(100vh - 130px);background:rgba(22,22,40,.85);border:1px solid rgba(255,255,255,.08);border-radius:20px;overflow:hidden;}
    .chat-sidebar{width:248px;border-right:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;flex-shrink:0;}
    .chat-sidebar-head{padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.06);font-size:14px;font-weight:700;}
    .conv-list{flex:1;overflow-y:auto;}
    .conv-item{padding:12px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.04);transition:background .15s;}
    .conv-item:hover{background:rgba(255,255,255,.05);}.conv-item.active{background:rgba(255,100,50,.08);}
    .conv-item .cn{font-size:13px;font-weight:600;color:#fff;margin-bottom:2px;}
    .conv-item .cm{font-size:11px;color:#888;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .chat-main{flex:1;display:flex;flex-direction:column;}
    .chat-head{padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;}
    .avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#FF4444,#FF8C00);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;}
    .messages-area{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;}
    .empty-chat{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;color:#555;text-align:center;}
    .bubble{max-width:68%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5;word-break:break-word;}
    .bubble.sent{background:linear-gradient(135deg,#FF4444,#FF8C00);color:#fff;align-self:flex-end;border-bottom-right-radius:4px;}
    .bubble.recv{background:rgba(255,255,255,.08);color:#ddd;align-self:flex-start;border-bottom-left-radius:4px;}
    .bubble .time{font-size:10px;opacity:.55;margin-top:4px;display:block;}
    .reply-btn{font-size:10px;color:rgba(255,255,255,.45);background:none;border:none;cursor:pointer;margin-top:3px;display:block;}
    .reply-bar{background:rgba(255,100,50,.1);border-left:3px solid #FF6B35;padding:8px 12px;font-size:12px;color:#aaa;margin:0 14px 6px;border-radius:0 8px 8px 0;display:none;}
    .reply-bar button{float:right;background:none;border:none;color:#888;cursor:pointer;font-size:14px;}
    .chat-input-row{padding:10px 14px;border-top:1px solid rgba(255,255,255,.06);display:flex;gap:8px;}
    .chat-input-row input{flex:1;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:24px;padding:10px 16px;color:#fff;font-size:14px;outline:none;}
    .chat-input-row input:focus{border-color:#FF6B35;}
    .chat-input-row input::placeholder{color:#555;}
    .btn-send{padding:10px 18px;border:none;border-radius:24px;background:linear-gradient(135deg,#FF4444,#FF8C00);color:#fff;font-size:13px;font-weight:700;cursor:pointer;}
    .empty-state{text-align:center;padding:60px 20px;color:#555;}
    .spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:5px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    @media(max-width:600px){.search-row{flex-direction:column;}.chat-sidebar{width:180px;}header{padding:0 10px;}}
  </style>
</head>
<body>
<header>
  <a class="logo" href="#">
    <canvas id="logoCanvas" width="36" height="26"></canvas>
    <span>RoomSync</span>
  </a>
  <div class="nav-tabs">
    <button class="tab active" id="tabSearch" onclick="showTab('search')">🔍 Search PG</button>
    <button class="tab" id="tabChat" onclick="showTab('chat')">💬 Chat<span class="notif-dot" id="chatDot"></span></button>
  </div>
  <div class="header-right">
    <span class="free-badge ok" id="freeBadge" onclick="goPayment()">💬 5 free chats</span>
    <span class="user-name" id="userName"></span>
    <button class="btn-logout" onclick="logout()">Logout</button>
  </div>
</header>

<main>
  <!-- Search -->
  <div class="section active" id="secSearch">
    <div class="search-card">
      <h2>🔍 Find Your Perfect PG</h2>
      <div class="search-row">
        <div class="field"><label>LOCATION</label><input type="text" id="searchLoc" placeholder="e.g. Noida, Delhi…" oninput="debounce()"/></div>
        <div class="field" style="max-width:150px"><label>ROOM TYPE</label>
          <select id="searchSize" onchange="searchPGs()">
            <option value="">All Types</option>
            <option value="Single">Single</option>
            <option value="Double">Double</option>
            <option value="Triple">Triple</option>
            <option value="Dormitory">Dormitory</option>
          </select>
        </div>
        <div class="field" style="max-width:130px"><label>GENDER</label>
          <select id="searchGender" onchange="searchPGs()">
            <option value="">Any</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <button class="btn-search" onclick="searchPGs()">Search</button>
        <button class="btn-reset" onclick="resetSearch()">Reset</button>
      </div>
    </div>
    <div class="results-hdr">
      <h3 id="resultsTitle">All PG Listings</h3>
      <span id="resultsCount"></span>
    </div>
    <div class="pg-grid" id="pgGrid"><div style="text-align:center;padding:40px;color:#555;grid-column:1/-1"><span class="spinner"></span> Loading…</div></div>
  </div>

  <!-- Chat -->
  <div class="section" id="secChat">
    <div class="chat-layout">
      <div class="chat-sidebar">
        <div class="chat-sidebar-head">💬 Messages</div>
        <div class="conv-list" id="convList">
          <div style="padding:16px;text-align:center;color:#555;font-size:12px">No conversations yet.<br/>Contact a seller from a PG listing.</div>
        </div>
      </div>
      <div class="chat-main">
        <div class="chat-head" id="chatHead"><span style="color:#555;font-weight:400;font-size:13px">Select a conversation</span></div>
        <div class="messages-area" id="messagesArea"><div class="empty-chat"><div style="font-size:36px;margin-bottom:8px">💬</div><p>0 messages</p></div></div>
        <div class="reply-bar" id="replyBar"></div>
        <div class="chat-input-row" id="chatInputRow" style="display:none">
          <input type="text" id="chatInput" placeholder="Type a message…" onkeydown="if(event.key==='Enter')sendMsg()"/>
          <button class="btn-send" onclick="sendMsg()">Send</button>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- PG Modal -->
<div class="modal-overlay" id="pgModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div id="modalContent"></div>
  </div>
</div>

<script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
<script>
const API    = 'https://roomsync-3-jwfx.onrender.com/api';
const SERVER = 'https://roomsync-3-jwfx.onrender.com';
const token  = localStorage.getItem('rs_token');
const user   = JSON.parse(localStorage.getItem('rs_user') || 'null');
if (!token || !user) { window.location.replace('signin.html'); }
if (user.role !== 'customer') { window.location.replace('role.html'); }

// Prevent back to role page
history.replaceState(null,'',location.href);
window.addEventListener('popstate',()=>history.replaceState(null,'',location.href));

document.getElementById('userName').textContent = user.fullName;
const authH = {'Authorization':`Bearer ${token}`,'Content-Type':'application/json'};

// ── Animated Logo ─────────────────────────────────────────────────────────────
const lc=document.getElementById('logoCanvas'), lx=lc.getContext('2d');
const LW=lc.width,LH=lc.height;
const lnodes=[{x:18,y:13,r:4,color:'#FF4444',vx:0,vy:0},{x:5,y:5,r:2.5,color:'#FFD700',vx:.3,vy:.2},
  {x:32,y:4,r:2,color:'#A78BFA',vx:-.2,vy:.25},{x:34,y:22,r:2.5,color:'#60A5FA',vx:-.25,vy:-.2},{x:6,y:22,r:2,color:'#34D399',vx:.2,vy:-.25}];
(function animLogo(){
  lx.clearRect(0,0,LW,LH);
  for(let i=1;i<lnodes.length;i++){
    lx.beginPath();lx.moveTo(lnodes[0].x,lnodes[0].y);lx.lineTo(lnodes[i].x,lnodes[i].y);
    lx.strokeStyle='rgba(255,255,255,.25)';lx.lineWidth=.8;lx.stroke();
  }
  lnodes.forEach((n,i)=>{
    lx.beginPath();lx.arc(n.x,n.y,n.r,0,Math.PI*2);lx.fillStyle=n.color;lx.fill();
    if(i>0){n.x+=n.vx;n.y+=n.vy;if(n.x<2||n.x>LW-2)n.vx*=-1;if(n.y<2||n.y>LH-2)n.vy*=-1;}
  });
  requestAnimationFrame(animLogo);
})();

// ── Notifications ─────────────────────────────────────────────────────────────
async function requestNotifPerm(){
  if('Notification' in window && Notification.permission==='default') await Notification.requestPermission();
}
function showNotif(title,body){
  if('Notification' in window && Notification.permission==='granted' && document.hidden)
    new Notification(title,{body,tag:'roomsync-msg'});
}
requestNotifPerm();

// ── Free message badge ────────────────────────────────────────────────────────
async function checkFreeMsgs() {
  try {
    const r=await fetch(`${API}/payment/status`,{headers:authH});
    const d=await r.json();
    const badge=document.getElementById('freeBadge');
    if (d.isPaid) {
      const exp=new Date(d.subscriptionExpiry).toLocaleDateString('en-IN');
      badge.className='free-badge ok'; badge.textContent=`✅ Active till ${exp}`; badge.onclick=null;
    } else if (d.freeRemaining <= 0) {
      badge.className='free-badge locked'; badge.textContent='🔒 Subscribe to chat'; badge.onclick=goPayment;
    } else {
      badge.className=d.freeRemaining<=2?'free-badge warn':'free-badge ok';
      badge.textContent=`💬 ${d.freeRemaining} free left`; badge.onclick=goPayment;
    }
  } catch(e){}
}
checkFreeMsgs();
function goPayment(){window.location.href=`payment.html?reason=customer&redirect=customer.html`;}

// ── Socket.io ─────────────────────────────────────────────────────────────────
const socket=io(SERVER);
socket.emit('join',user.id);
let unreadCount=0;
socket.on('receive_message',msg=>{
  const inChat=document.getElementById('secChat').classList.contains('active');
  const pid=(msg.senderId._id||msg.senderId);
  if(inChat && pid===currentPartnerId){ appendMsg(msg); }
  else {
    unreadCount++;
    document.getElementById('chatDot').style.display='block';
    showNotif('RoomSync – New Message',`${msg.senderId.fullName||'Seller'}: ${msg.message}`);
  }
  loadConversations();
});

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(tab){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const k=tab.charAt(0).toUpperCase()+tab.slice(1);
  document.getElementById('sec'+k).classList.add('active');
  document.getElementById('tab'+k).classList.add('active');
  if(tab==='chat'){loadConversations();unreadCount=0;document.getElementById('chatDot').style.display='none';}
}

// ── Search ────────────────────────────────────────────────────────────────────
let st;
function debounce(){clearTimeout(st);st=setTimeout(searchPGs,500);}

async function searchPGs(){
  const loc=document.getElementById('searchLoc').value.trim();
  const size=document.getElementById('searchSize').value;
  const gender=document.getElementById('searchGender').value;
  const p=new URLSearchParams();
  if(loc)p.set('location',loc);if(size)p.set('roomSize',size);if(gender)p.set('gender',gender);
  document.getElementById('resultsTitle').textContent=loc||size||gender?'Search Results':'All PG Listings';
  const grid=document.getElementById('pgGrid');
  grid.innerHTML='<div style="text-align:center;padding:40px;color:#555;grid-column:1/-1"><span class="spinner"></span></div>';
  try{
    const r=await fetch(`${API}/pg/all?${p}`);
    const pgs=await r.json();
    document.getElementById('resultsCount').textContent=`${pgs.length} found`;
    if(!pgs.length){grid.innerHTML='<div class="empty-state" style="grid-column:1/-1"><div style="font-size:40px">🏠</div><p>No PGs found.</p></div>';return;}
    grid.innerHTML='';
    pgs.forEach(pg=>grid.appendChild(makePGCard(pg)));
  }catch(e){grid.innerHTML=`<div style="grid-column:1/-1;text-align:center;color:#f66;padding:30px">${e.message}</div>`;}
}

function resetSearch(){
  document.getElementById('searchLoc').value='';
  document.getElementById('searchSize').value='';
  document.getElementById('searchGender').value='';
  searchPGs();
}

function makePGCard(pg){
  const card=document.createElement('div'); card.className='pg-card';
  const gc=pg.genderAllowed==='Male'?'gm':pg.genderAllowed==='Female'?'gf':'ga';
  const ph=pg.photos.length
    ?`<img src="${SERVER}/uploads/${pg.photos[0]}" alt="" loading="lazy"/>${pg.photos.length>1?`<div class="photo-count">📸 ${pg.photos.length}</div>`:''}`
    :'<div class="no-photo">🏠</div>';
  card.innerHTML=`<div class="pg-photos">${ph}</div>
    <div class="pg-body">
      <h3>${pg.pgName}</h3>
      <p class="pg-loc">📍 ${pg.location}</p>
      <div class="pg-badges"><span class="badge ${gc}">${pg.genderAllowed}</span><span class="badge bs">${pg.roomSize}</span></div>
      <div class="pg-stats"><span>👁 ${pg.views}</span><span>❤️ ${pg.likes}</span></div>
      <p class="pg-seller">Posted by <span>${pg.sellerId?.fullName||'Seller'}</span></p>
      <button class="btn-contact" onclick="openPG('${pg._id}','${pg.sellerId?._id}','${pg.sellerId?.fullName||'Seller'}',event)">View Details & Contact</button>
    </div>`;
  return card;
}

// ── PG Modal — NO phone/email shown ──────────────────────────────────────────
async function openPG(pgId,sellerId,sellerName,e){
  e.stopPropagation();
  fetch(`${API}/pg/${pgId}/view`,{method:'POST'}).catch(()=>{});
  try{
    const r=await fetch(`${API}/pg/${pgId}`);
    const pg=await r.json();
    const gc=pg.genderAllowed==='Male'?'gm':pg.genderAllowed==='Female'?'gf':'ga';
    const photosHtml=pg.photos.length
      ?pg.photos.map(p=>`<img src="${SERVER}/uploads/${p}" alt=""/>`).join('')
      :'<p style="color:#888;grid-column:1/-1;text-align:center;padding:20px">No photos</p>';
    document.getElementById('modalContent').innerHTML=`
      <h2 style="font-size:20px;font-weight:700;margin-bottom:5px;
        background:linear-gradient(135deg,#FF4444,#FF8C00);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">${pg.pgName}</h2>
      <p style="color:#888;font-size:13px;margin-bottom:14px">📍 ${pg.location}</p>
      <div class="modal-photos">${photosHtml}</div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">
        <span class="badge ${gc}">${pg.genderAllowed}</span>
        <span class="badge bs">🛏 ${pg.roomSize}</span>
      </div>
      ${pg.rules?`<div style="background:rgba(255,255,255,.04);border-radius:10px;padding:14px;margin-bottom:14px">
        <p style="color:#aaa;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:5px">RULES</p>
        <p style="color:#ccc;font-size:13px;line-height:1.6">${pg.rules}</p></div>`:''}
      <div style="background:rgba(255,100,50,.06);border:1px solid rgba(255,100,50,.15);border-radius:10px;padding:14px;margin-bottom:14px">
        <p style="color:#aaa;font-size:11px;font-weight:600;letter-spacing:.5px;margin-bottom:6px">LISTED BY</p>
        <p style="color:#fff;font-size:15px;font-weight:700">${pg.sellerId?.fullName||'Seller'}</p>
        <p style="color:#888;font-size:12px;margin-top:2px">Chat via RoomSync for contact details</p>
      </div>
      <button class="btn-contact" onclick="startChat('${pg.sellerId?._id}','${pg.sellerId?.fullName}')">💬 Chat with Seller</button>`;
    document.getElementById('pgModal').classList.add('open');
  }catch(e){alert('Failed to load PG.');}
}
function closeModal(){document.getElementById('pgModal').classList.remove('open');}
document.getElementById('pgModal').onclick=e=>{if(e.target===document.getElementById('pgModal'))closeModal();};

function startChat(sellerId,sellerName){
  closeModal(); showTab('chat');
  setTimeout(()=>openConv(sellerId,sellerName),200);
}

// ── Chat ──────────────────────────────────────────────────────────────────────
let currentPartnerId=null, replyTo=null;

async function loadConversations(){
  const list=document.getElementById('convList');
  try{
    const r=await fetch(`${API}/chat/conversations`,{headers:authH});
    const convs=await r.json();
    if(!convs.length){list.innerHTML='<div style="padding:16px;text-align:center;color:#555;font-size:12px">No conversations yet.</div>';return;}
    list.innerHTML='';
    convs.forEach(c=>{
      const d=document.createElement('div');
      d.className=`conv-item${c.partnerId===currentPartnerId?' active':''}`;
      d.innerHTML=`<div class="cn">${c.partnerName}</div><div class="cm">${c.lastMessage}</div>`;
      d.onclick=()=>openConv(c.partnerId,c.partnerName);
      list.appendChild(d);
    });
  }catch(e){}
}

async function openConv(partnerId,partnerName){
  currentPartnerId=partnerId;
  document.getElementById('chatHead').innerHTML=`<div class="avatar">${partnerName.charAt(0).toUpperCase()}</div>${partnerName}`;
  document.getElementById('chatInputRow').style.display='flex';
  const area=document.getElementById('messagesArea');
  area.innerHTML='<div style="padding:20px;text-align:center;color:#555"><span class="spinner"></span></div>';
  try{
    const r=await fetch(`${API}/chat/messages/${partnerId}`,{headers:authH});
    const msgs=await r.json();
    area.innerHTML='';
    if(!msgs.length){area.innerHTML='<div class="empty-chat"><div style="font-size:32px">💬</div><p>0 messages</p></div>';return;}
    msgs.forEach(m=>appendMsg(m));
  }catch(e){}
}

function appendMsg(msg){
  const area=document.getElementById('messagesArea');
  if(area.querySelector('.empty-chat'))area.innerHTML='';
  const mine=(msg.senderId._id||msg.senderId)===user.id;
  const d=document.createElement('div'); d.className=`bubble ${mine?'sent':'recv'}`;
  d.innerHTML=`${msg.message}<span class="time">${new Date(msg.createdAt).toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</span>
    ${!mine?`<button class="reply-btn" onclick="setReply('${msg.message.replace(/'/g,"\\'")}')">↩ Reply</button>`:''}`;
  area.appendChild(d); area.scrollTop=area.scrollHeight;
}

function setReply(txt){
  replyTo=txt;
  const bar=document.getElementById('replyBar');
  bar.style.display='block';
  bar.innerHTML=`↩ "${txt.substring(0,50)}" <button onclick="clearReply()">✕</button>`;
  document.getElementById('chatInput').focus();
}
function clearReply(){replyTo=null;document.getElementById('replyBar').style.display='none';}

async function sendMsg(){
  const input=document.getElementById('chatInput');
  const msg=input.value.trim();
  if(!msg||!currentPartnerId)return;
  const full=replyTo?`[↩ "${replyTo.substring(0,30)}"] ${msg}`:msg;
  try{
    // Use REST to check limit first
    const r=await fetch(`${API}/chat/send`,{
      method:'POST',headers:authH,
      body:JSON.stringify({receiverId:currentPartnerId,message:full})
    });
    const d=await r.json();
    if(r.status===402){
      goPayment(); return;
    }
    if(!r.ok) throw new Error(d.message);
    // Emit via socket for real-time
    socket.emit('send_message',{senderId:user.id,receiverId:currentPartnerId,message:full});
    input.value=''; clearReply();
    checkFreeMsgs();
  }catch(e){alert(e.message);}
}

function logout(){localStorage.removeItem('rs_token');localStorage.removeItem('rs_user');window.location.replace('signin.html');}

searchPGs();
</script>
