<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>RoomSync – Choose Role</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#0d0d1a;min-height:100vh;
      display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
    body::before{content:'';position:fixed;top:-20%;left:-10%;width:50%;height:70%;
      background:radial-gradient(ellipse,rgba(120,0,30,.55) 0%,transparent 70%);pointer-events:none;}
    body::after{content:'';position:fixed;bottom:-20%;right:-10%;width:50%;height:70%;
      background:radial-gradient(ellipse,rgba(10,20,80,.6) 0%,transparent 70%);pointer-events:none;}
    .wrap{position:relative;z-index:10;text-align:center;padding:20px;width:100%;max-width:500px;}
    .logo-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:8px;}
    h1{font-size:42px;font-weight:900;background:linear-gradient(135deg,#FF4444,#FF8C00);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .sub{color:#8888aa;font-size:14px;margin-bottom:32px;}
    .card{background:rgba(22,22,40,.9);border:1px solid rgba(255,255,255,.07);border-radius:22px;
      padding:38px 40px;backdrop-filter:blur(12px);box-shadow:0 20px 60px rgba(0,0,0,.5);}
    .role-label{color:#8888aa;font-size:12px;font-weight:600;letter-spacing:2px;
      text-transform:uppercase;margin-bottom:24px;}
    .greeting{color:#ccc;font-size:14px;margin-bottom:16px;}
    .role-btns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;}
    .btn-role{padding:16px 44px;border:none;border-radius:50px;font-size:16px;font-weight:700;
      cursor:pointer;transition:transform .2s,box-shadow .2s;min-width:140px;}
    .btn-customer{background:linear-gradient(135deg,#FF4444,#E53E3E);color:#fff;
      box-shadow:0 6px 24px rgba(255,68,68,.45);}
    .btn-seller{background:linear-gradient(135deg,#FF8C00,#F97316);color:#fff;
      box-shadow:0 6px 24px rgba(255,140,0,.45);}
    .btn-role:hover{transform:translateY(-3px) scale(1.04);}
    .btn-role:disabled{opacity:.5;cursor:not-allowed;transform:none;}
    .msg{padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;
      background:rgba(255,68,68,.15);color:#ff6b6b;border:1px solid rgba(255,68,68,.3);}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);
      border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
    @keyframes spin{to{transform:rotate(360deg);}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="logo-row">
    <canvas id="logoCanvas" width="80" height="56"></canvas>
    <h1>RoomSync</h1>
  </div>
  <p class="sub">Sync your room with your Buddy!</p>
  <div class="card">
    <p class="greeting" id="greeting"></p>
    <p class="role-label">Choose Your Role</p>
    <div id="alertBox"></div>
    <div class="role-btns">
      <button class="btn-role btn-customer" id="btnC" onclick="selectRole('customer')">🏠 Customer</button>
      <button class="btn-role btn-seller"   id="btnS" onclick="selectRole('seller')">🏪 Seller</button>
    </div>
  </div>
</div>
<script>
  const API   = 'http://localhost:3000/api';
  const token = localStorage.getItem('rs_token');
  const user  = JSON.parse(localStorage.getItem('rs_user') || 'null');

  // ── Guard ──────────────────────────────────────────────────────────────────
  if (!token || !user) { window.location.replace('signin.html'); }

  // ── If role already set, skip this page entirely ───────────────────────────
  if (user && user.role === 'seller')   { window.location.replace('seller.html'); }
  if (user && user.role === 'customer') { window.location.replace('customer.html'); }

  // Prevent back navigation to this page after role is chosen
  history.pushState(null, '', location.href);
  window.addEventListener('popstate', () => history.pushState(null, '', location.href));

  document.getElementById('greeting').textContent = `Welcome, ${user.fullName}! 👋`;

  // ── Animated constellation logo ────────────────────────────────────────────
  const canvas = document.getElementById('logoCanvas');
  const ctx    = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const nodes = [
    { x:cx,   y:cy,   r:6, color:'#FF4444', vx:0,    vy:0    },
    { x:18,   y:14,   r:4, color:'#FFD700', vx:.4,   vy:.25  },
    { x:68,   y:10,   r:3, color:'#A78BFA', vx:-.3,  vy:.35  },
    { x:74,   y:42,   r:4, color:'#60A5FA', vx:-.35, vy:-.2  },
    { x:22,   y:44,   r:3, color:'#34D399', vx:.3,   vy:-.3  },
    { x:6,    y:30,   r:3, color:'#F472B6', vx:.35,  vy:.15  },
  ];
  function drawLogo() {
    ctx.clearRect(0, 0, W, H);
    for (let i = 1; i < nodes.length; i++) {
      ctx.beginPath();
      ctx.moveTo(nodes[0].x, nodes[0].y);
      ctx.lineTo(nodes[i].x, nodes[i].y);
      const dist = Math.hypot(nodes[i].x-nodes[0].x, nodes[i].y-nodes[0].y);
      ctx.strokeStyle = `rgba(255,255,255,${Math.max(0, .35 - dist/200)})`;
      ctx.lineWidth = 1; ctx.stroke();
    }
    for (let i = 1; i < nodes.length; i++) {
      for (let j = i+1; j < nodes.length; j++) {
        const d = Math.hypot(nodes[i].x-nodes[j].x, nodes[i].y-nodes[j].y);
        if (d < 30) {
          ctx.beginPath();
          ctx.moveTo(nodes[i].x, nodes[i].y);
          ctx.lineTo(nodes[j].x, nodes[j].y);
          ctx.strokeStyle = `rgba(255,255,255,${.15*(1-d/30)})`;
          ctx.lineWidth = .8; ctx.stroke();
        }
      }
    }
    nodes.forEach((n, i) => {
      const grd = ctx.createRadialGradient(n.x,n.y,0,n.x,n.y,n.r*2);
      grd.addColorStop(0, n.color);
      grd.addColorStop(1, 'transparent');
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r*2,0,Math.PI*2);
      ctx.fillStyle = grd; ctx.fill();
      ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,Math.PI*2);
      ctx.fillStyle = n.color; ctx.fill();
      if (i > 0) {
        n.x += n.vx; n.y += n.vy;
        if (n.x < 4 || n.x > W-4) n.vx *= -1;
        if (n.y < 4 || n.y > H-4) n.vy *= -1;
      }
    });
    requestAnimationFrame(drawLogo);
  }
  drawLogo();

  async function selectRole(role) {
    const btn = role==='customer' ? document.getElementById('btnC') : document.getElementById('btnS');
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner"></span>Setting up…`;
    try {
      const r = await fetch(`${API}/auth/set-role`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ userId: user.id, role })
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.message);
      user.role = role;
      localStorage.setItem('rs_user', JSON.stringify(user));
      // Replace history so back button won't return here
      window.location.replace(role === 'seller' ? 'seller.html' : 'customer.html');
    } catch(e) {
      document.getElementById('alertBox').innerHTML = `<div class="msg">${e.message}</div>`;
      btn.disabled = false;
      btn.textContent = role === 'customer' ? '🏠 Customer' : '🏪 Seller';
    }
  }
</script>
</body>
</html>
